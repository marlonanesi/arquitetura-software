# O Rollout substitui o Deployment e acrescenta a estratégia de canary, com análise automática.
# Sem roteador de tráfego, o percentual é a proporção de réplicas: com 5 réplicas, 20% = 1 réplica nova.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app
  namespace: canario
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: app
          image: lunalog/canario:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /saude, port: 8000 }
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
  strategy:
    canary:
      steps:
        - setWeight: 20              # 1 de 5 réplicas na versão nova
        - analysis:                  # analisa o canary com tráfego real; se reprovar, aborta
            templates:
              - templateName: taxa-de-erro
            args:
              - name: hash-do-canary
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 60              # 3 de 5 réplicas
        - pause: { duration: 10s }
        # Depois do último passo, a versão é promovida a 100%.
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: canario
spec:
  type: NodePort
  selector: { app: app }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
