# Prometheus mínimo: coleta /metrics dos pods da aplicação, e é a fonte da análise do canary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: canario
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: canario
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: canario
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: canario
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: canario
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: app
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [canario]
        relabel_configs:
          # Só os pods da aplicação, na porta 8000
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: app
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          # O hash do template do pod identifica a "revisão" (estável ou canary) no Argo Rollouts
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: pod_template_hash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: canario
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: canario
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
