# Tráfego contínuo, como Job dentro do cluster.
# Pré-requisito (uma vez): kubectl -n deploy create configmap k6-scripts --from-file=k6/
# Para repetir: kubectl -n deploy delete job trafego
# Para apontar para o blue/green, troque ALVO para "app-bg".
apiVersion: batch/v1
kind: Job
metadata:
  name: trafego
  namespace: deploy
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/trafego.js"]
          env:
            - { name: ALVO, value: "app" }
            - { name: TAXA, value: "30" }
            - { name: DURACAO, value: "90s" }
          volumeMounts: [{ name: scripts, mountPath: /scripts }]
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
