# RECREATE: derruba TODAS as réplicas antigas e só então sobe as novas. Simples, mas há downtime.
# Aplique este arquivo sobre o Deployment "app" para trocar a estratégia e comparar com o rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: deploy
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: app
          image: lunalog/versionado:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /saude, port: 8000 }
            periodSeconds: 2
            failureThreshold: 1
