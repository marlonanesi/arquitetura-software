# ROLLING UPDATE: troca as réplicas aos poucos.
#   maxSurge: 1        -> pode haver 1 pod A MAIS que o desejado durante a troca
#   maxUnavailable: 0  -> nenhum pod pronto pode ser removido antes de o novo ficar pronto
# Resultado: a capacidade nunca cai durante a troca.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: deploy
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: app
          image: lunalog/versionado:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          # A readiness é o que torna a troca segura: o pod só recebe tráfego quando /saude responde 200.
          readinessProbe:
            httpGet: { path: /saude, port: 8000 }
            periodSeconds: 2
            failureThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: deploy
spec:
  type: NodePort
  selector: { app: app }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
