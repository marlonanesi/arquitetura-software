<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronômetro da sessão de decisão</title>
<style>
  :root { --fundo:#101820; --texto:#f2f4f6; --suave:#8fa3b5; --ok:#3ddc97; --alerta:#ffb703; --estouro:#ff5d5d; --painel:#1b2733; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--fundo); color:var(--texto); min-height:100vh; display:flex; flex-direction:column; }
  header { padding:1rem 1.5rem; color:var(--suave); display:flex; justify-content:space-between; font-size:1rem; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; text-align:center; }
  #bloco { font-size:clamp(1.4rem,4vw,2.4rem); font-weight:600; margin-bottom:.4rem; }
  #quem { color:var(--suave); font-size:clamp(1rem,2.2vw,1.4rem); margin-bottom:1.2rem; min-height:1.6em; }
  #tempo { font-size:clamp(5rem,22vw,14rem); font-variant-numeric:tabular-nums; font-weight:700; line-height:1; }
  #tempo.alerta { color:var(--alerta); } #tempo.estouro { color:var(--estouro); animation: piscar 1s steps(2) infinite; }
  @keyframes piscar { 50% { opacity:.35; } }
  #barra { width:min(900px,90vw); height:14px; background:var(--painel); border-radius:7px; margin:1.4rem 0; overflow:hidden; }
  #progresso { height:100%; width:0; background:var(--ok); transition:width .3s; }
  #descricao { max-width:900px; color:var(--suave); font-size:clamp(1rem,2vw,1.3rem); min-height:3.2em; }
  .controles { display:flex; gap:.8rem; flex-wrap:wrap; justify-content:center; margin:1rem 0; }
  button { background:var(--painel); color:var(--texto); border:1px solid #2c3e50; border-radius:8px; padding:.7rem 1.2rem; font-size:1rem; cursor:pointer; }
  button:hover { border-color:var(--ok); } button:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  footer { padding:1rem 1.5rem 1.5rem; display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; }
  .item { padding:.35rem .7rem; border-radius:6px; background:var(--painel); color:var(--suave); font-size:.85rem; }
  .item.atual { background:var(--ok); color:#06210f; font-weight:700; } .item.feito { opacity:.5; text-decoration:line-through; }
  .dica { color:var(--suave); font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<header><span id="titulo">Sessão de decisão</span><span id="geral">Total: 60 min</span></header>
<main>
  <div id="bloco">Pronto para começar</div>
  <div id="quem"></div>
  <div id="tempo" role="timer" aria-live="off">05:00</div>
  <div id="barra"><div id="progresso"></div></div>
  <div id="descricao"></div>
  <div class="controles">
    <button id="btnIniciar">Iniciar / pausar (espaço)</button>
    <button id="btnProximo">Próximo bloco (→)</button>
    <button id="btnAnterior">Bloco anterior (←)</button>
    <button id="btnMais">+1 min (+)</button>
    <button id="btnReiniciar">Reiniciar (R)</button>
  </div>
  <div class="dica">Atalhos: espaço, setas, + e R. Funciona offline: basta abrir este arquivo.</div>
</main>
<footer id="lista"></footer>

<script>
  // A agenda é a mesma de agenda-60min.md. Edite aqui para adaptar a sua sessão: [nome, minutos, quem conduz, descrição].
  const AGENDA = [
    ["Abertura", 5, "Driver", "Ler a decisão, o prazo, os papéis e os critérios. O Approver confirma que decide hoje."],
    ["Contexto e dados", 10, "Driver", "Apresentar o que sabemos, sem defender nada. Perguntas só para esclarecer."],
    ["Posições", 15, "Cada contributor", "3 minutos cada, sem interrupção: posição, o que mais pesa e qual critério está em jogo."],
    ["Discussão por critério", 15, "Driver", "Critério a critério: qual opção é melhor aqui, e por quê? Registrar no ADR ao vivo."],
    ["Preocupações e riscos", 5, "Driver", "Rodada rápida: qual é o seu maior receio com cada opção?"],
    ["Decisão", 5, "Approver", "O Approver diz a decisão e por quê. Os demais confirmam se foram ouvidos."],
    ["Fechamento", 5, "Driver", "Ler o ADR em voz alta. Próximos passos, responsáveis, a quem avisar."],
  ];

  let indice = 0, restante = AGENDA[0][1] * 60, rodando = false, relogio = null, estouro = false;
  const $ = (id) => document.getElementById(id);

  function formatar(s) {
    const sinal = s < 0 ? "-" : "";
    s = Math.abs(s);
    return sinal + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function desenhar() {
    const [nome, minutos, quem, descricao] = AGENDA[indice];
    $("bloco").textContent = `${indice + 1} de ${AGENDA.length}: ${nome}`;
    $("quem").textContent = `Conduz: ${quem}`;
    $("descricao").textContent = descricao;
    $("tempo").textContent = formatar(restante);
    $("tempo").className = restante < 0 ? "estouro" : (restante <= 60 ? "alerta" : "");
    $("progresso").style.width = Math.max(0, Math.min(100, ((minutos * 60 - restante) / (minutos * 60)) * 100)) + "%";
    $("progresso").style.background = restante < 0 ? "var(--estouro)" : (restante <= 60 ? "var(--alerta)" : "var(--ok)");
    $("lista").innerHTML = AGENDA.map((a, i) =>
      `<span class="item ${i === indice ? "atual" : (i < indice ? "feito" : "")}">${a[0]} (${a[1]} min)</span>`).join("");
    const gastos = AGENDA.slice(0, indice).reduce((t, a) => t + a[1], 0);
    $("geral").textContent = `Total: ${AGENDA.reduce((t, a) => t + a[1], 0)} min (${gastos} min dos blocos anteriores)`;
    document.title = `${formatar(restante)} | ${nome}`;
  }

  function passo() { restante -= 1; if (restante < 0 && !estouro) { estouro = true; bipe(); } desenhar(); }
  function bipe() {
    try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); setTimeout(() => { o.stop(); c.close(); }, 300); } catch (e) { /* sem áudio */ }
  }
  function alternar() { rodando = !rodando; if (rodando) relogio = setInterval(passo, 1000); else clearInterval(relogio); $("btnIniciar").textContent = rodando ? "Pausar (espaço)" : "Iniciar / pausar (espaço)"; }
  function ir(delta) { indice = Math.max(0, Math.min(AGENDA.length - 1, indice + delta)); restante = AGENDA[indice][1] * 60; estouro = false; desenhar(); }
  function reiniciar() { if (rodando) alternar(); indice = 0; restante = AGENDA[0][1] * 60; estouro = false; desenhar(); }

  $("btnIniciar").onclick = alternar; $("btnProximo").onclick = () => ir(1); $("btnAnterior").onclick = () => ir(-1);
  $("btnMais").onclick = () => { restante += 60; desenhar(); }; $("btnReiniciar").onclick = reiniciar;
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); alternar(); }
    else if (e.key === "ArrowRight") ir(1); else if (e.key === "ArrowLeft") ir(-1);
    else if (e.key === "+") { restante += 60; desenhar(); } else if (e.key.toLowerCase() === "r") reiniciar();
  });
  desenhar();
</script>
</body>
</html>
