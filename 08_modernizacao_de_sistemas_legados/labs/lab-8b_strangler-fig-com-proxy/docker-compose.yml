name: lab-8b-strangler

services:
  # O monólito legado. Também exposto em :9081 só para você ver as estatísticas dele.
  legado:
    build: ./servicos
    command: ["python", "legado.py"]
    ports:
      - "9081:8000"

  # O serviço novo, que assume as rotas aos poucos. Exposto em :9082 para consulta direta.
  novo:
    build: ./servicos
    command: ["python", "novo.py"]
    ports:
      - "9082:8000"

  # O estrangulador: o Nginx na frente de tudo. Os clientes só conhecem este endereço (:9080).
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/rotas.conf:/etc/nginx/rotas.conf:ro
      - ./nginx/sombra-clientes.conf:/etc/nginx/sombra-clientes.conf:ro
    ports:
      - "9080:80"
    depends_on:
      - legado
      - novo
