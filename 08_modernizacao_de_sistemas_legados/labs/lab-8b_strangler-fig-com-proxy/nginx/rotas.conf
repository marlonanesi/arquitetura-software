# TABELA DE MIGRAÇÃO. Para migrar uma rota, mude a linha dela e recarregue o Nginx:
#   docker compose exec proxy nginx -s reload
# Para fazer ROLLBACK, desfaça a mudança e recarregue. É uma linha.
#
# Cada bloco split_clients decide, para cada requisição, entre "novo" e "legado", pela proporção indicada.
# Como usar:
#   - 0% migrado  : somente "* legado;"                 (situação inicial)
#   - 20% migrado : "20% novo;" e "* legado;"           (canário: 20% novo, o resto no legado)
#   - 100% migrado: somente "* novo;"
# O Nginx exige percentuais maiores que zero, então "0%" é a ausência da linha de percentual.

upstream legado { server legado:8000; }
upstream novo   { server novo:8000; }

# /cotacao
split_clients "${request_id}" $cotacao_pct {
    #20%    novo;
    *      legado;
}

# /clientes (começa só em modo sombra: veja o sombra-clientes.conf)
split_clients "${request_id}" $clientes_pct {
    #20%    novo;
    *      legado;
}

# /relatorios
split_clients "${request_id}" $relatorios_pct {
    #20%    novo;
    *      legado;
}

# Quem manda o header "X-Beta: 1" vai SEMPRE para o serviço novo, em qualquer rota migrável.
# Serve para a equipe testar o novo em produção antes de abrir para os clientes.
map $http_x_beta $beta {
    default 0;
    "1"     1;
}

map "$beta:$cotacao_pct"    $destino_cotacao    { "~^1:" novo; "~:novo$" novo; default legado; }
map "$beta:$clientes_pct"   $destino_clientes   { "~^1:" novo; "~:novo$" novo; default legado; }
map "$beta:$relatorios_pct" $destino_relatorios { "~^1:" novo; "~:novo$" novo; default legado; }
