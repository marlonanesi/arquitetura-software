events {}

http {
    # Onde cada rota vai: upstreams, percentuais de migração e roteamento por header.
    # É AQUI que você migra: edite o rotas.conf e recarregue ("nginx -s reload").
    include /etc/nginx/rotas.conf;

    server {
        listen 80;

        # --- /cotacao: migração por percentual (canário) e por header ---
        location /cotacao {
            add_header X-Destino $destino_cotacao always;
            proxy_pass http://$destino_cotacao;
        }

        # --- /clientes: começa em MODO SOMBRA ---
        # O cliente continua sendo atendido pelo legado; o Nginx envia uma CÓPIA de cada chamada ao serviço
        # novo (mirror), cuja resposta é descartada. Serve para ver o serviço novo sob tráfego real, sem risco.
        location /clientes {
            include /etc/nginx/sombra-clientes.conf;
            add_header X-Destino $destino_clientes always;
            proxy_pass http://$destino_clientes;
        }
        location = /_espelho_clientes {
            internal;
            proxy_set_header X-Sombra 1;
            proxy_pass http://novo$request_uri;
        }

        # --- /relatorios: migração por percentual ---
        location /relatorios {
            add_header X-Destino $destino_relatorios always;
            proxy_pass http://$destino_relatorios;
        }

        # --- /entregas: ainda 100% no legado (o modelo dela exige uma camada anticorrupção: lab 8C) ---
        location /entregas {
            add_header X-Destino legado always;
            proxy_pass http://legado;
        }
    }
}
