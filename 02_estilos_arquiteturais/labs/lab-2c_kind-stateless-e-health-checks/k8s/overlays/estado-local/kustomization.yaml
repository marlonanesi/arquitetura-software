# Versão com o erro de design: o comprovante é gravado no disco do próprio contêiner.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lunalog

resources:
  - ../../base

configMapGenerator:
  - name: comprovantes-config
    literals:
      - ARMAZENAMENTO=local
      - WARMUP_SEGUNDOS=20
      - BANNER=versao com estado local
