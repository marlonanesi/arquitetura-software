name: lab-6a-otel

x-servico: &servico
  build: ./app
  environment: &env-servico
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    VIASUL_MS: "${VIASUL_MS:-2800}"
  depends_on:
    - otel-collector

services:
  # --- Os quatro serviços da cotação: mesma imagem, papéis diferentes ---
  cotacao:
    <<: *servico
    environment:
      <<: *env-servico
      SERVICO: cotacao
      URL_PROXIMO: http://rotas:8000
    ports:
      - "8000:8000"

  rotas:
    <<: *servico
    environment:
      <<: *env-servico
      SERVICO: rotas
      URL_PROXIMO: http://tarifas:8000
      # 0 = este serviço NÃO propaga o contexto de rastreamento para o próximo (usado no cenário de falha)
      PROPAGAR_CONTEXTO: "${ROTAS_PROPAGA:-1}"

  tarifas:
    <<: *servico
    environment:
      <<: *env-servico
      SERVICO: tarifas
      URL_PROXIMO: http://transportadoras:8000

  transportadoras:
    <<: *servico
    environment:
      <<: *env-servico
      SERVICO: transportadoras

  # --- Ponto único de saída da telemetria ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/${COLLECTOR_CONFIG:-collector-jaeger.yaml}"]
    volumes:
      - ./collector:/etc/otelcol:ro
    ports:
      - "8889:8889"   # métricas no formato Prometheus (usadas no lab 6B)
    depends_on:
      - jaeger
      - zipkin

  # --- Backends de traces. A aplicação não sabe quais deles existem. ---
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  zipkin:
    image: openzipkin/zipkin:3.4.2
    ports:
      - "9411:9411"

  # Gerador de carga leve, para produzir métricas. Use: docker compose run --rm k6 run /scripts/carga.js
  k6:
    image: grafana/k6:0.54.0
    profiles: ["ferramentas"]
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - cotacao
