# Duas "aplicações" servidas dos mesmos arquivos estáticos. O que muda entre elas é o client_id.
server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.CONFIG = { clientId: 'portal', nome: 'Portal da transportadora' };";
    }
}

server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.CONFIG = { clientId: 'painel', nome: 'Painel de operações' };";
    }
}
