# Balanceador simples (round-robin) na frente de duas réplicas da API.
events {}
http {
    upstream api {
        server api1:8000;
        server api2:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }
    }
}
