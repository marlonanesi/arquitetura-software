# Um único HAProxy com um "balanceador" por porta, cada um com um algoritmo ou uma camada diferente.
# As três instâncias têm capacidades distintas: app-a (10 ms), app-b (50 ms) e app-c (200 ms).

global
    log stdout format raw local0
    maxconn 4096

# DNS interno do Docker. Sem isto, o HAProxy resolve os nomes UMA vez, na partida, e passa a falar com
# endereços velhos quando um contêiner é recriado (as instâncias mudam de IP).
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 1s

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    # Health check ativo: GET /saude a cada 1 s; 2 falhas retiram a instância, 2 acertos a devolvem.
    option httpchk GET /saude
    default-server check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

# ---- painel de estatísticas -------------------------------------------------
frontend painel
    bind *:8399
    stats enable
    stats uri /stats
    stats refresh 2s

# ---- 1. Round-robin: uma instância de cada vez, em ordem ---------------------
frontend fe_rr
    bind *:8301
    default_backend bk_rr
backend bk_rr
    balance roundrobin
    server a app-a:8000
    server b app-b:8000
    server c app-c:8000

# ---- 2. Least connections: a próxima requisição vai para a menos ocupada ------
frontend fe_leastconn
    bind *:8302
    default_backend bk_leastconn
backend bk_leastconn
    balance leastconn
    server a app-a:8000
    server b app-b:8000
    server c app-c:8000

# ---- 3. IP hash (source): o mesmo cliente sempre na mesma instância -----------
frontend fe_source
    bind *:8303
    default_backend bk_source
backend bk_source
    balance source
    server a app-a:8000
    server b app-b:8000
    server c app-c:8000

# ---- 4. Pesos: proporção por capacidade (a=6, b=3, c=1) -----------------------
frontend fe_peso
    bind *:8304
    default_backend bk_peso
backend bk_peso
    balance roundrobin
    server a app-a:8000 weight 6
    server b app-b:8000 weight 3
    server c app-c:8000 weight 1

# ---- 5. Afinidade de sessão por cookie (round-robin + cookie "LB") ------------
frontend fe_sticky
    bind *:8305
    default_backend bk_sticky
backend bk_sticky
    balance roundrobin
    cookie LB insert indirect nocache
    server a app-a:8000 cookie a
    server b app-b:8000 cookie b
    server c app-c:8000 cookie c

# ---- 6. L4 (TCP): repassa bytes; não enxerga caminho, header nem cookie --------
frontend fe_l4
    bind *:8306
    mode tcp
    default_backend bk_l4
backend bk_l4
    mode tcp
    balance roundrobin
    option tcp-check
    server a app-a:8000
    server b app-b:8000
    server c app-c:8000

# ---- 7. L7 (HTTP): roteia por caminho e por header ----------------------------
frontend fe_l7
    bind *:8307
    acl rota_rastreamento path_beg /api/rastreamento
    acl rota_relatorios   path_beg /api/relatorios
    acl cliente_premium   req.hdr(X-Cliente) -i premium
    use_backend bk_premium      if cliente_premium
    use_backend bk_rastreamento if rota_rastreamento
    use_backend bk_relatorios   if rota_relatorios
    default_backend bk_geral
backend bk_premium
    balance roundrobin
    server a app-a:8000                 # só a instância mais rápida atende o plano premium
backend bk_rastreamento
    balance roundrobin
    server a app-a:8000
    server b app-b:8000
backend bk_relatorios
    balance roundrobin
    server c app-c:8000                 # relatórios pesados ficam isolados na instância lenta
backend bk_geral
    balance roundrobin
    server a app-a:8000
    server b app-b:8000
    server c app-c:8000
