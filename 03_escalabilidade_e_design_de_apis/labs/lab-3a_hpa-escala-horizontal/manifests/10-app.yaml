apiVersion: v1
kind: Namespace
metadata:
  name: escala
---
# Redis: guarda as sessões quando SESSOES=redis (estado externalizado).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: escala
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: escala
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
# O "banco": atende UMA requisição por vez, 20 ms cada. Capacidade fixa de cerca de 50 por segundo,
# não importa quantas réplicas da aplicação existam.
apiVersion: v1
kind: ConfigMap
metadata:
  name: banco-script
  namespace: escala
data:
  banco.py: |
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            time.sleep(0.02)          # custo de cada consulta
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")
        def log_message(self, *a):
            pass

    print("banco de capacidade fixa (~50 consultas/s) na porta 8000", flush=True)
    HTTPServer(("0.0.0.0", 8000), H).serve_forever()    # HTTPServer atende uma conexao por vez
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banco
  namespace: escala
spec:
  replicas: 1
  selector:
    matchLabels: { app: banco }
  template:
    metadata:
      labels: { app: banco }
    spec:
      containers:
        - name: banco
          image: python:3.12-slim
          command: ["python", "-u", "/app/banco.py"]
          volumeMounts: [{ name: script, mountPath: /app }]
      volumes:
        - name: script
          configMap: { name: banco-script }
---
apiVersion: v1
kind: Service
metadata:
  name: banco
  namespace: escala
spec:
  selector: { app: banco }
  ports: [{ port: 8000 }]
---
# A API de cotação. Começa com 1 réplica; quem muda esse número é o HPA (ou você, com "kubectl scale").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking
  namespace: escala
spec:
  replicas: 1
  selector:
    matchLabels: { app: tracking }
  template:
    metadata:
      labels: { app: tracking }
    spec:
      containers:
        - name: tracking
          image: lunalog/tracking-cpu:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SESSOES, value: "memoria" }
          # O HPA calcula o uso de CPU em relação ao "request": 100m. O limite de 250m
          # impede um pod de consumir mais que isso, o que torna a escala horizontal necessária.
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          # Dá tempo para o pod sair do balanceamento antes de receber o SIGTERM (evita erros ao reduzir réplicas).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Probe tolerante de propósito: sob carga alta o pod responde devagar, e uma probe rígida o marcaria
          # como "não pronto". O HPA ignora pods não prontos, e a escala não aconteceria justamente quando precisa.
          readinessProbe:
            httpGet: { path: /info, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: tracking
  namespace: escala
spec:
  type: NodePort
  selector: { app: tracking }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
