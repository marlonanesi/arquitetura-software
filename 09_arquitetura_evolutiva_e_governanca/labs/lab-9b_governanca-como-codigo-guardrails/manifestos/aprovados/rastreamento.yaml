apiVersion: apps/v1
kind: Deployment
metadata:
  name: rastreamento
  labels:
    app: rastreamento
    lunalog.io/dono: time-rastreamento
spec:
  replicas: 3
  selector:
    matchLabels: { app: rastreamento }
  template:
    metadata:
      labels: { app: rastreamento }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: lunalog/rastreamento:1.4.2
        ports: [{ containerPort: 8000 }]
        resources:
          limits: { cpu: 500m, memory: 256Mi }
          requests: { cpu: 100m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /saude, port: 8000 }
