# A excecao deste batch venceu em 2026-09-30 (excecoes/excecoes.yaml): a regra volta a valer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-migracao
  labels:
    app: batch-migracao
    lunalog.io/dono: time-batch-migracao
spec:
  replicas: 3
  selector:
    matchLabels: { app: batch-migracao }
  template:
    metadata:
      labels: { app: batch-migracao }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: lunalog/batch-migracao:1.4.2
        ports: [{ containerPort: 8000 }]
        readinessProbe:
          httpGet: { path: /saude, port: 8000 }
