apiVersion: apps/v1
kind: Deployment
metadata:
  name: autenticacao
  labels:
    app: autenticacao
    lunalog.io/dono: time-autenticacao
spec:
  replicas: 3
  selector:
    matchLabels: { app: autenticacao }
  template:
    metadata:
      labels: { app: autenticacao }
    spec:
      containers:
      - name: app
        image: lunalog/autenticacao:1.4.2
        ports: [{ containerPort: 8000 }]
        resources:
          limits: { cpu: 500m, memory: 256Mi }
          requests: { cpu: 100m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /saude, port: 8000 }
